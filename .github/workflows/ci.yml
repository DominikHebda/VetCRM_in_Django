name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vetcrm_test
          POSTGRES_USER: vetcrm_user
          POSTGRES_PASSWORD: vetcrm_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetcrm_user -d vetcrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql://vetcrm_user:vetcrm_password@localhost:5432/vetcrm_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Run deployment security check
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-secure-check-key-7f41c9e8a2b64d53a1098c74e6f213bd8a5c1d90
        run: python manage.py check --deploy

      - name: Run tests
        env:
          DJANGO_DEBUG: "True"
        run: pytest
