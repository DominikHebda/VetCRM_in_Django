services:
  - type: web
    name: vetcrm-api
    runtime: docker
    plan: free

    healthCheckPath: /health/ready/

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://vetcrm-web.onrender.com"

      - key: DATABASE_URL
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vetcrm-api.onrender.com,https://vetcrm-web.onrender.com"

  - type: web
    name: vetcrm-web
    runtime: static

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_BASE_URL
        value: "https://vetcrm-api.onrender.com"

      - key: VITE_OAUTH_REDIRECT_URI
        value: "https://vetcrm-web.onrender.com/auth/callback"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
