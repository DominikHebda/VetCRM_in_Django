databases:
  - name: vetcrm-db
    databaseName: vetcrm
    user: vetcrm

services:
  - type: web
    name: vetcrm-api
    runtime: docker

    healthCheckPath: /health/ready/

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://example-frontend.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: vetcrm-db
          property: connectionString
