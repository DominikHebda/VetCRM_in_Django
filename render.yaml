services:
  - type: web
    name: vetcrm-web
    runtime: static

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_BASE_URL
        value: "https://vetcrm-api.onrender.com"

      - key: VITE_OAUTH_REDIRECT_URI
        value: "https://vetcrm-web.onrender.com/auth/callback"

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
