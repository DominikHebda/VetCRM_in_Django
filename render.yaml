databases:
  - name: vetcrm-db
    plan: free
    databaseName: vetcrm
    user: vetcrm

services:
  - type: web
    name: vetcrm-api
    runtime: docker
    plan: free

    healthCheckPath: /health/ready/

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://vetcrm-api.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: vetcrm-db
          property: connectionString

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vetcrm-api.onrender.com"
