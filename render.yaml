services:
  - type: web
    name: vetcrm-web
    runtime: static
    branch: main

    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist

    envVars:
      - key: VITE_API_BASE_URL
        value: "https://vetcrm-api.onrender.com"

      - key: VITE_OAUTH_REDIRECT_URI
        value: "https://vetcrm-web.onrender.com/auth/callback"

      - key: VITE_OAUTH_CLIENT_ID
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: vetcrm-api
    runtime: docker
    plan: free
    region: oregon
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready/

    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      - key: DJANGO_DEBUG
        sync: false

      - key: DJANGO_SECRET_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false
