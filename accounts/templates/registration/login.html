<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - VetCRM</title>
</head>
<body>
    <main>
        <h1>Logowanie do VetCRM</h1>

        {% if form.errors %}
            <p>Nieprawidłowa nazwa użytkownika lub hasło.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div>
                <label for="{{ form.username.id_for_label }}">
                    Nazwa użytkownika
                </label>
                {{ form.username }}
            </div>

            <div>
                <label for="{{ form.password.id_for_label }}">
                    Hasło
                </label>
                {{ form.password }}
            </div>

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit">Zaloguj</button>
        </form>
    </main>
</body>
</html>
